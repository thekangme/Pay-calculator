<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>증여세 계산기 | PayCalc 계산기</title><meta name="description" content="증여자와의 관계, 혼인·출산공제 여부를 반영해 예상 증여세를 계산하세요."><link rel="stylesheet" href="./styles.css"></head><body><header class="topbar"><a class="brand" href="./index.html">PayCalc</a></header><main class="tool-page" data-calculator="gift"><a class="back-link" href="./index.html#calculator-menu">← 계산기 메뉴</a><section class="hero compact-hero"><div class="hero-copy"><h1>증여세 계산기</h1><p>배우자, 부모·자녀, 기타친족 공제와 혼인·출산 추가공제를 반영합니다.</p></div></section><section class="tool-layout"><form class="tool-card tool-form"><label><span>증여금액</span><div class="input-wrap"><input data-field="asset" inputmode="numeric" value="150,000,000"><span>원</span></div></label><label><span>증여자 관계</span><select data-field="relation" data-kind="text"><option value="spouse">배우자</option><option value="ascendant" selected>직계존속(부모·조부모)</option><option value="minorAscendant">직계존속 → 미성년자</option><option value="descendant">직계비속(자녀·손자녀)</option><option value="relative">기타친족</option><option value="other">그 외</option></select></label><label><span>혼인·출산 추가공제</span><select data-field="marriageBirth" data-kind="text"><option value="no">미적용</option><option value="yes" selected>적용</option></select></label><button class="primary" type="submit">계산하기</button></form><section class="tool-result" aria-live="polite"><p>예상 증여세</p><strong data-main-result>0원</strong><dl class="result-list" data-breakdown></dl><p class="notice">증여재산공제는 10년 합산 한도입니다. 혼인·출산 공제는 요건 충족 시 직계존속 증여에 추가로 최대 1억원까지 적용됩니다.</p></section></section><article class="article-box"><h2>증여세 계산 기준</h2><p>증여금액에서 관계별 공제와 혼인·출산 추가공제를 차감한 과세표준에 누진세율을 적용합니다.</p></article></main><script src="./tools.js"></script></body></html>
