<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>상속세 계산기 | Paylab 계산기</title><meta name="description" content="상속재산과 공제액을 입력해 예상 상속세를 계산하세요."><link rel="stylesheet" href="../styles.css"></head><body><header class="topbar"><a class="brand" href="../index.html">Paylab 계산기</a><nav><a href="../index.html#calculator">계산기</a><a href="../index.html#salary-table">연봉표</a></nav></header><main class="tool-page" data-calculator="inheritance"><a class="back-link" href="../index.html#calculator-menu">← 계산기 메뉴</a><section class="hero compact-hero"><div class="hero-copy"><h1>상속세 계산기</h1><p>상속재산에서 공제액과 채무를 뺀 과세표준으로 예상 세액을 계산합니다.</p></div></section><div class="ad-slot">광고 영역</div><section class="tool-layout"><form class="tool-card tool-form"><label><span>상속재산</span><div class="input-wrap"><input data-field="asset" inputmode="numeric" value="1,000,000,000"><span>원</span></div></label><label><span>채무·장례비 등</span><div class="input-wrap"><input data-field="debt" inputmode="numeric" value="50,000,000"><span>원</span></div></label><label><span>상속공제</span><div class="input-wrap"><input data-field="deduction" inputmode="numeric" value="500,000,000"><span>원</span></div></label><button class="primary" type="submit">계산하기</button></form><section class="tool-result" aria-live="polite"><p>예상 상속세</p><strong data-main-result>0원</strong><dl class="result-list" data-breakdown></dl><p class="notice">상속세는 가족관계, 배우자공제, 금융재산공제 등에 따라 크게 달라지는 추정값입니다.</p></section></section><article class="article-box"><h2>상속세 계산 기준</h2><p>상속세는 과세표준에 10~50% 누진세율을 적용하고 누진공제를 차감합니다. 실제 신고 전에는 세무 전문가 검토가 필요합니다.</p></article></main><script src="../tools.js"></script></body></html>
