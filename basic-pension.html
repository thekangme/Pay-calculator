<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기초연금 계산기 | PayCalc</title>
    <meta name="description" content="나이, 가구유형, 월 소득과 재산을 입력해 기초연금 수급 가능성과 예상 수령액을 계산하세요." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://paycalc.co.kr/basic-pension.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="기초연금 계산기" />
    <meta property="og:description" content="2026년 기준 기초연금 수급 가능성과 예상 수령액을 간단히 확인하세요." />
    <meta property="og:locale" content="ko_KR" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html">PayCalc</a>
    </header>

    <main class="tool-page" data-calculator="basicPension">
      <a class="back-link" href="./index.html#calculator-menu">← 계산기 메뉴</a>
      <section class="hero compact-hero">
        <div class="hero-copy">
          <h1>기초연금 계산기</h1>
          <p>만 65세 이상 기준으로 소득인정액과 예상 기초연금액을 계산합니다.</p>
        </div>
      </section>

      <section class="tool-layout">
        <form class="tool-card tool-form">
          <label>
            <span>가구 유형</span>
            <select data-field="household" data-kind="text">
              <option value="single" selected>단독가구</option>
              <option value="couple">부부가구</option>
            </select>
          </label>
          <label>
            <span>나이</span>
            <input data-field="age" type="number" value="65" min="0" />
          </label>
          <label>
            <span>월 근로·사업소득</span>
            <div class="input-wrap"><input data-field="monthlyIncome" inputmode="numeric" placeholder="예: 1,500,000" /><span>원</span></div>
          </label>
          <label>
            <span>월 국민연금 수령액</span>
            <div class="input-wrap"><input data-field="nationalPension" inputmode="numeric" placeholder="예: 400,000" /><span>원</span></div>
          </label>
          <label>
            <span>일반재산</span>
            <div class="input-wrap"><input data-field="asset" inputmode="numeric" placeholder="예: 120,000,000" /><span>원</span></div>
          </label>
          <label>
            <span>금융재산</span>
            <div class="input-wrap"><input data-field="financialAsset" inputmode="numeric" placeholder="예: 20,000,000" /><span>원</span></div>
          </label>
          <label>
            <span>부채</span>
            <div class="input-wrap"><input data-field="debt" inputmode="numeric" placeholder="예: 30,000,000" /><span>원</span></div>
          </label>
          <button class="primary" type="submit">계산하기</button>
        </form>

        <section class="tool-result" aria-live="polite">
          <p>예상 기초연금</p>
          <strong data-main-result>0원</strong>
          <dl class="result-list" data-breakdown></dl>
          <p class="notice">실제 수급 여부는 주소지 주민센터 또는 국민연금공단 심사 결과와 다를 수 있습니다.</p>
        </section>
      </section>

      <article class="article-box">
        <h2>기초연금 계산 기준</h2>
        <p>기초연금은 가구 유형별 선정기준액과 소득인정액을 비교해 수급 가능성을 판단합니다. 이 계산기는 근로소득 공제, 재산의 소득환산, 국민연금 수령액에 따른 감액을 간단히 반영한 추정 계산기입니다.</p>
      </article>
    </main>

    <script src="./tools.js"></script>
  </body>
</html>
